<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Dashboard — Contact Intelligence</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;padding:16px}
.header{text-align:center;padding:20px 0}
.header h1{font-size:1.8rem;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .subtitle{color:#94a3b8;font-size:0.9rem;margin-top:4px}

/* Stats grid */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:20px 0}
.stat-card{background:#1e293b;border-radius:12px;padding:16px;text-align:center;border:1px solid #334155}
.stat-card .num{font-size:2rem;font-weight:700;color:#38bdf8}
.stat-card .label{font-size:0.7rem;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.stat-card.a1 .num{color:#4ade80}
.stat-card.sg .num{color:#f472b6}
.stat-card.sh .num{color:#fb923c}
.stat-card.hk .num{color:#a78bfa}
.stat-card.warm .num{color:#fbbf24}
.stat-card.cold .num{color:#f87171}
.stat-card.fu .num{color:#34d399}
.stat-card.apac .num{color:#2dd4bf}
.stat-card.strong .num{color:#4ade80}
.stat-card.med .num{color:#60a5fa}

/* Charts section */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin:20px 0}
.chart-card{background:#1e293b;border-radius:12px;padding:20px;border:1px solid #334155}
.chart-card h3{font-size:0.9rem;color:#94a3b8;margin-bottom:16px;text-transform:uppercase;letter-spacing:1px}
.chart-card canvas{width:100%!important;max-height:280px}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0;align-items:center}
.filters select,.filters input{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:8px 12px;border-radius:8px;font-size:0.85rem}
.filters input{flex:1;min-width:200px}
.filters select{min-width:120px}
.count{color:#94a3b8;font-size:0.85rem;margin:8px 0}

/* Table */
table{width:100%;border-collapse:collapse;font-size:0.82rem}
thead{position:sticky;top:0;z-index:10}
th{background:#1e293b;padding:8px 10px;text-align:left;font-weight:600;color:#94a3b8;text-transform:uppercase;font-size:0.65rem;letter-spacing:1px;cursor:pointer;border-bottom:2px solid #334155;user-select:none}
th:hover{color:#e2e8f0}
th .arrow{margin-left:4px;font-size:0.6rem}
td{padding:8px 10px;border-bottom:1px solid #1e293b;vertical-align:middle}
tr:hover{background:#1e293b}

/* Badges */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.65rem;font-weight:700;text-transform:uppercase}
.badge-strong{background:#064e3b;color:#4ade80;border:1px solid #065f46}
.badge-warm{background:#422006;color:#fbbf24;border:1px solid #854d0e}
.badge-weak{background:#1e293b;color:#94a3b8;border:1px solid #334155}
.badge-cold{background:#450a0a;color:#f87171;border:1px solid #991b1b}
.badge-high{background:#064e3b;color:#4ade80;border:1px solid #065f46}
.badge-medium{background:#422006;color:#fbbf24;border:1px solid #854d0e}
.badge-low{background:#450a0a;color:#fca5a5;border:1px solid #991b1b}
.badge-org{background:#3b0764;color:#c084fc;border:1px solid #6b21a8}

/* Health score bar */
.health-bar{width:60px;height:8px;background:#334155;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle}
.health-fill{height:100%;border-radius:4px}
.health-fill.low{background:#f87171}
.health-fill.mid{background:#fbbf24}
.health-fill.high{background:#4ade80}

/* Tags */
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:0.65rem;margin-right:4px}
.tag-pm{background:#164e63;color:#67e8f9}
.tag-strat{background:#2d1b69;color:#c4b5fd}
.tag-cross{background:#1a3a2a;color:#86efac}
.tag-bd{background:#4a1d1d;color:#fca5a5}
.tag-gm{background:#3d2e0b;color:#fde68a}
.tag-follow{background:#450a0a;color:#fca5a5;border:1px solid #991b1b;font-size:0.6rem;padding:1px 6px;margin-left:4px}
.tag-apac{background:#0e4429;color:#34d399;border:1px solid #065f46;font-size:0.6rem;padding:1px 6px;margin-left:4px}
.en-title{color:#94a3b8;font-size:0.75rem;font-style:italic}
a{color:#38bdf8;text-decoration:none}
a:hover{text-decoration:underline}
.city-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:0.7rem;background:#334155;color:#cbd5e1}

/* Timeline */
.timeline{margin:12px 0;padding:12px 16px;background:#1e293b;border-radius:8px;border:1px solid #334155;max-height:300px;overflow-y:auto}
.timeline-item{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid #0f172a;align-items:flex-start}
.timeline-item:last-child{border-bottom:none}
.timeline-date{color:#64748b;font-size:0.7rem;min-width:70px;flex-shrink:0}
.timeline-content{flex:1;font-size:0.8rem}
.timeline-content .name{color:#38bdf8;font-weight:600}
.timeline-content .company{color:#94a3b8}
.timeline-content .summary{color:#cbd5e1;margin-top:2px;font-size:0.75rem}
.timeline-type{display:inline-block;padding:1px 6px;border-radius:4px;font-size:0.6rem;font-weight:600;text-transform:uppercase}
.type-email{background:#1e3a5f;color:#60a5fa}
.type-meeting{background:#064e3b;color:#4ade80}
.type-call{background:#422006;color:#fbbf24}
.type-linkedin{background:#164e63;color:#67e8f9}
.type-other{background:#334155;color:#94a3b8}

/* Top companies */
.top-companies{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.top-co{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:8px 14px;font-size:0.8rem;display:flex;align-items:center;gap:8px}
.top-co .count{color:#38bdf8;font-weight:700;font-size:1.1rem}
.top-co .name{color:#e2e8f0}

@media(max-width:768px){
  table{font-size:0.7rem}
  td,th{padding:5px 6px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .charts{grid-template-columns:1fr}
  .hide-mobile{display:none}
}
</style>
</head>

  </div>

    <canvas id="healthChart"></canvas>
  </div>
  <div class="chart-card">

    <canvas id="interactionChart"></canvas>

<div class="chart-card" style="margin-bottom:16px">

<div class="chart-card" style="margin-bottom:16px">

  <select id="filterSource"><option value="">All Sources</option><option value="crm-db">CRM DB</option><option value="manual">Manual</option></select>
  <select id="filterType"><option value="">All Types</option><option value="org">Organizations</option><option value="person">People</option></select>
</div>
<div class="count" id="showCount"></div>

<table>
<thead>
<tr>
  <th onclick="sortTable(0)">Strength <span class="arrow"></span></th>
  <th onclick="sortTable(1)">Name <span class="arrow"></span></th>

  <th onclick="sortTable(3)">City <span class="arrow"></span></th>
  <th onclick="sortTable(4)" class="hide-mobile">Priority <span class="arrow"></span></th>
  <th onclick="sortTable(5)" class="hide-mobile">Health <span class="arrow"></span></th>
  <th onclick="sortTable(6)" class="hide-mobile">Contact Date <span class="arrow"></span></th>
  <th onclick="sortTable(7)" class="hide-mobile">Source <span class="arrow"></span></th>
  <th>Tags</th>
  <th>LinkedIn</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

// Charts (pure canvas, no libs)
function drawDonut(canvasId, data, colors, labels){
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const size = Math.min(canvas.parentElement.clientWidth-40,260);
  canvas.width = size; canvas.height = size;
  const cx=size/2, cy=size/2, r=size/2-10, inner=r*0.55;
  const total = data.reduce((a,b)=>a+b,0);
  if(total===0) return;
  let angle = -Math.PI/2;
  data.forEach((v,i)=>{
    const slice = (v/total)*2*Math.PI;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(angle)*inner, cy+Math.sin(angle)*inner);
    ctx.arc(cx,cy,r,angle,angle+slice);
    ctx.arc(cx,cy,inner,angle+slice,angle,true);
    ctx.closePath();
    ctx.fillStyle=colors[i];
    ctx.fill();
    angle+=slice;
  });
  // Center text
  ctx.fillStyle='#e2e8f0';
  ctx.font='bold 18px sans-serif';
  ctx.textAlign='center';
  ctx.fillText(total,cx,cy+6);
  // Legend
  let ly = size+8;
  canvas.style.height = (size+labels.length*22+20)+'px';
  labels.forEach((lb,i)=>{
    const pct = total>0?Math.round(data[i]/total*100):0;
    ctx.fillStyle=colors[i];
    ctx.fillRect(10,ly+i*20,12,12);
    ctx.fillStyle='#e2e8f0';
    ctx.font='12px sans-serif';
    ctx.textAlign='left';
    ctx.fillText(`${lb}: ${data[i]} (${pct}%)`,28,ly+i*20+10);
  });
}

function drawBar(canvasId, data, colors, labels){
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const w = canvas.parentElement.clientWidth-40;
  const maxV = Math.max(...data,1);
  const barH = 24;
  const gap = 8;
  canvas.width = w;
  canvas.height = data.length*(barH+gap)+20;
  data.forEach((v,i)=>{
    const y = i*(barH+gap);
    const bw = (v/maxV)*(w-140);
    ctx.fillStyle=colors[i%colors.length];
    ctx.fillRect(120,y,bw,barH);
    ctx.fillStyle='#94a3b8';
    ctx.font='12px sans-serif';
    ctx.textAlign='right';
    ctx.fillText(labels[i],110,y+16);
    ctx.fillStyle='#e2e8f0';
    ctx.textAlign='left';
    ctx.fillText(v,125+bw,y+16);
  });
}

// Table rendering
let filtered = [...CONTACTS];
let sortCol = -1, sortAsc = true;

function render(){
  const search = (document.getElementById('search').value||'').toLowerCase();
  const fStr = document.getElementById('filterStrength').value;
  const fPri = document.getElementById('filterPriority').value;
  const fFu = document.getElementById('filterFollowUp').value;
  const fApac = document.getElementById('filterApac').value;
  const fSrc = document.getElementById('filterSource').value;
  const fType = document.getElementById('filterType').value;

  filtered = CONTACTS.filter(c=>{
    if(search && !`${c.name} ${c.company} ${c.notes||''} ${c.title||''}`.toLowerCase().includes(search)) return false;
    if(fStr && c.relationship_strength!==fStr) return false;
    if(fPri && c._priority!==fPri) return false;
    if(fFu==='true' && !c.follow_up_needed) return false;
    if(fFu==='false' && c.follow_up_needed) return false;
    if(fApac==='true' && !c.apac_relevant) return false;
    if(fSrc && c._source!==fSrc) return false;
    if(fType==='org' && !c._is_org) return false;
    if(fType==='person' && c._is_org) return false;
    return true;
  });

  if(sortCol>=0){
    const keys=['relationship_strength','name','company','city','_priority','_health_score','connection_date','_source'];
    const key=keys[sortCol];
    filtered.sort((a,b)=>{
      let va=a[key]||'', vb=b[key]||'';
      if(typeof va==='string') va=va.toLowerCase();
      if(typeof vb==='string') vb=vb.toLowerCase();
      if(va<vb) return sortAsc?-1:1;
      if(va>vb) return sortAsc?1:-1;
      return 0;
    });
  }

  document.getElementById('showCount').textContent=`Showing ${filtered.length} of ${CONTACTS.length} contacts`;
  const tbody=document.getElementById('tableBody');
  tbody.innerHTML=filtered.map(c=>{
    const sClass=c.relationship_strength==='strong'?'badge-strong':c.relationship_strength==='warm'?'badge-warm':c.relationship_strength==='cold'?'badge-cold':'badge-weak';
    const pClass=c._priority==='high'?'badge-high':c._priority==='medium'?'badge-medium':'badge-low';
    const hs=c._health_score||0;
    const hsColor=hs<=30?'low':hs<=60?'mid':'high';
    const tags=(c.relevance_tags||[]).slice(0,3).map(t=>`<span class="tag tag-pm">${t}</span>`).join('');
    const fuTag=c.follow_up_needed?`<span class="tag-follow">FU</span>`:'';
    const apacTag=c.apac_relevant?`<span class="tag-apac">APAC</span>`:'';
    const orgTag=c._is_org?`<span class="badge badge-org">ORG</span>`:'';
    const liLink=c.linkedin?`<a href="${c.linkedin}" target="_blank">↗</a>`:'—';
    return `<tr>
      <td><span class="badge ${sClass}">${c.relationship_strength||'?'}</span></td>
      <td>${c.name} ${orgTag}</td>
      <td>${c.company||''}</td>
      <td><span class="city-tag">${c.city||'—'}</span></td>
      <td class="hide-mobile"><span class="badge ${pClass}">${c._priority||'?'}</span></td>
      <td class="hide-mobile"><span class="health-bar"><span class="health-fill ${hsColor}" style="width:${hs}%"></span></span> ${hs}</td>
      <td class="hide-mobile">${c.connection_date||'—'}</td>
      <td class="hide-mobile">${c._source||'—'}</td>
      <td>${tags}${fuTag}${apacTag}</td>
      <td>${liLink}</td>
    </tr>`;
  }).join('');
}

function sortTable(col){
  if(sortCol===col) sortAsc=!sortAsc;
  else{ sortCol=col; sortAsc=true; }
  render();
  document.querySelectorAll('th').forEach((th,i)=>{
    const arrow=th.querySelector('.arrow');
    if(arrow) arrow.textContent=i===col?(sortAsc?'▲':'▼'):'';
  });
}
