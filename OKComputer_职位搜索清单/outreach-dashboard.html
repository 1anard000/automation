<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outreach Pipeline Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;padding:16px}
.header{text-align:center;padding:20px 0}
.header h1{font-size:1.8rem;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .subtitle{color:#94a3b8;font-size:0.9rem;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:20px 0}
.stat-card{background:#1e293b;border-radius:12px;padding:16px;text-align:center;border:1px solid #334155}
.stat-card .num{font-size:2rem;font-weight:700;color:#38bdf8}
.stat-card .label{font-size:0.7rem;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.stat-card.green .num{color:#4ade80}
.stat-card.purple .num{color:#a78bfa}
.stat-card.orange .num{color:#fb923c}
.stat-card.pink .num{color:#f472b6}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0;align-items:center}
.filters select,.filters input{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:8px 12px;border-radius:8px;font-size:0.85rem}
.filters input{flex:1;min-width:200px}
.filters select{min-width:140px}
.count{color:#94a3b8;font-size:0.85rem;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:0.82rem}
thead{position:sticky;top:0;z-index:10}
th{background:#1e293b;padding:8px 10px;text-align:left;font-weight:600;color:#94a3b8;text-transform:uppercase;font-size:0.65rem;letter-spacing:1px;cursor:pointer;border-bottom:2px solid #334155;user-select:none}
th:hover{color:#e2e8f0}
th .arrow{margin-left:4px;font-size:0.6rem}
td{padding:8px 10px;border-bottom:1px solid #1e293b;vertical-align:middle}
tr:hover{background:#1e293b}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.65rem;font-weight:700;text-transform:uppercase}
.badge-s{background:#3b0764;color:#c084fc;border:1px solid #6b21a8}
.badge-a{background:#064e3b;color:#4ade80;border:1px solid #065f46}
.badge-not_started{background:#334155;color:#94a3b8;border:1px solid #475569}
.badge-in_progress{background:#422006;color:#fbbf24;border:1px solid #854d0e}
.badge-contacted{background:#1e3a5f;color:#60a5fa;border:1px solid #1e40af}
.badge-follow_up{background:#064e3b;color:#4ade80;border:1px solid #065f46}
.priority-bar{height:6px;border-radius:3px;background:#334155;overflow:hidden;min-width:60px}
.priority-fill{height:100%;border-radius:3px;transition:width 0.3s}
a{color:#38bdf8;text-decoration:none}
a:hover{text-decoration:underline}
.grades{display:flex;flex-wrap:wrap;gap:3px}
.grade-tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:0.6rem;font-weight:600}
.grade-s{background:#3b0764;color:#c084fc}
.grade-a{background:#064e3b;color:#4ade80}
.grade-b{background:#422006;color:#fbbf24}
.job-list{max-height:200px;overflow-y:auto;font-size:0.75rem;line-height:1.6}
.job-item{padding:2px 0;border-bottom:1px solid #1e293b}
.job-item:last-child{border:none}
.expand-btn{background:none;border:none;color:#38bdf8;cursor:pointer;font-size:0.8rem;padding:2px 6px}
.target-tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:0.6rem;background:#7c3aed;color:#ede9fe;margin-left:4px}
.email-tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:0.6rem;background:#065f46;color:#86efac;margin-left:4px}
.progress-ring{display:inline-flex;align-items:center;gap:4px}
.ring{width:32px;height:32px;border-radius:50%;background:conic-gradient(#38bdf8 var(--pct),#334155 0);display:flex;align-items:center;justify-content:center;font-size:0.6rem;font-weight:700}
.ring-inner{width:24px;height:24px;border-radius:50%;background:#0f172a;display:flex;align-items:center;justify-content:center}
@media(max-width:768px){
  table{font-size:0.7rem}
  td,th{padding:5px 6px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .hide-mobile{display:none}
}
</style>
</head>
<body>
<div class="header">
  <h1>🚀 Outreach Pipeline</h1>
  <div class="subtitle">Generated: Friday, July 31, 2026 — Career OS CRM</div>

<div class="stats" id="statsRow"></div>

    <option value="in_progress">In Progress</option>
    <option value="contacted">Contacted</option>
    <option value="follow_up">Follow Up</option>

  <select id="sortBy">

    <option value="openings">Sort: Openings</option>
    <option value="sgrade">Sort: S-Grade Count</option>

<div class="count" id="countLabel"></div>

</thead>
<tbody id="tableBody"></tbody>
</table>

    <div class="stat-card pink"><div class="num">${withEmail}</div><div class="label">Have Email</div></div>
    <div class="stat-card"><div class="num">${withTarget}</div><div class="label">Target Companies</div></div>
    <div class="stat-card green"><div class="num">${contacted}</div><div class="label">In Pipeline</div></div>
    <div class="stat-card"><div class="num">${notStarted}</div><div class="label">Not Started</div></div>
  `;
}

function gradeColor(g) {
  if (g.startsWith('S')) return 'grade-s';
  if (g.startsWith('A')) return 'grade-a';
  return 'grade-b';
}

function priorityColor(score, max) {
  const pct = Math.min(score / max * 100, 100);
  if (pct > 75) return '#4ade80';
  if (pct > 50) return '#fbbf24';
  if (pct > 25) return '#f472b6';
  return '#94a3b8';
}

function statusBadge(s) {
  return `<span class="badge badge-${s}">${s.replace(/_/g,' ')}</span>`;
}

function expandJobs(idx) {
  const el = document.getElementById('jobs-' + idx);
  if (el.style.display === 'none') {
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

function renderTable(data) {
  const maxPriority = Math.max(...data.map(e => e.priority_score));
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = data.map((e, i) => {
    const gradesHtml = e.grade_breakdown.split(', ').map(g => {
      const parts = g.split('×');
      return `<span class="grade-tag ${gradeColor(parts[0])}">${g}</span>`;
    }).join('');
    
    const jobsHtml = e.top_jobs.map(j => 
      `<div class="job-item"><span class="grade-tag ${gradeColor(j.grade)}" style="margin-right:4px">${j.grade}</span>${j.title} <span style="color:#64748b">@ ${j.location}</span></div>`
    ).join('');

    const maxBar = Math.max(...data.map(x => x.priority_score));
    const barPct = (e.priority_score / maxBar * 100).toFixed(0);
    const barColor = priorityColor(e.priority_score, maxBar);

    const contactsInfo = e.contacts.length > 0 
      ? e.contacts.map(c => `${c.name}${c.email ? ' 📧' : ''}`).join('<br>')
      : '<span style="color:#64748b">No contacts</span>';

    return `<tr>
      <td style="color:#64748b">${e.rank}</td>
      <td>
        <strong>${e.company}</strong>
        ${e.is_target ? '<span class="target-tag">TARGET</span>' : ''}
        ${e.has_email ? '<span class="email-tag">📧 HAS EMAIL</span>' : ''}
        <br><span style="color:#64748b;font-size:0.7rem">${e.total_openings} A/S openings</span>
      </td>
      <td>
        ${e.s_count > 0 ? `<span class="badge badge-s" style="margin-right:3px">S×${e.s_count}</span>` : ''}
        <span class="badge badge-a">A×${e.a_count}</span>
      </td>
      <td><div class="grades">${gradesHtml}</div></td>
      <td>
        <div class="priority-bar"><div class="priority-fill" style="width:${barPct}%;background:${barColor}"></div></div>
        <span style="font-size:0.7rem;color:#94a3b8">${e.priority_score}</span>
      </td>
      <td>${statusBadge(e.outreach_status)}</td>
      <td style="font-size:0.75rem;color:#94a3b8;max-width:180px">${e.next_action}</td>
      <td class="hide-mobile" style="font-size:0.75rem">${contactsInfo}</td>
    </tr>
    <tr id="jobs-${i}" style="display:none;background:#0c1322">
      <td colspan="8">
        <div style="padding:8px">
          <strong style="color:#38bdf8">Top Openings:</strong>
          <div class="job-list" style="margin-top:6px">${jobsHtml || 'No details'}</div>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function applyFilters() {
  const search = document.getElementById('searchBox').value.toLowerCase();
  const status = document.getElementById('statusFilter').value;
  const sortBy = document.getElementById('sortBy').value;

  let filtered = DATA.filter(e => {
    if (search && !e.company.toLowerCase().includes(search)) return false;
    if (status !== 'all' && e.outreach_status !== status) return false;
    return true;
  });

  if (sortBy === 'openings') filtered.sort((a,b) => b.total_openings - a.total_openings);
  else if (sortBy === 'sgrade') filtered.sort((a,b) => b.s_count - a.s_count || b.a_count - a.a_count);
  else if (sortBy === 'name') filtered.sort((a,b) => a.company.localeCompare(b.company));
  else filtered.sort((a,b) => b.priority_score - a.priority_score);

  document.getElementById('countLabel').textContent = `Showing ${filtered.length} of ${DATA.length} companies`;
  renderTable(filtered);
}

renderStats();
applyFilters();

document.getElementById('searchBox').addEventListener('input', applyFilters);
document.getElementById('statusFilter').addEventListener('change', applyFilters);
document.getElementById('sortBy').addEventListener('change', applyFilters);
</script>
</body>
</html>
