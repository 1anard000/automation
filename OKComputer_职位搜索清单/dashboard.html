<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career OS — Job Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--purple:#bc8cff;--green:#3fb950;--blue:#58a6ff;--cyan:#39d353;--yellow:#d29922;--gray:#8b949e;--red:#f85149;--orange:#db6d28;--radius:8px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}

.header{padding:24px 20px 16px;border-bottom:1px solid var(--border);text-align:center}
.header h1{font-size:1.6rem;font-weight:700;letter-spacing:-.02em}
.header p{color:var(--muted);font-size:.85rem;margin-top:4px}

.container{max-width:1400px;margin:0 auto;padding:16px}

/* Stats bar */
.stats-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;flex:1;min-width:120px;text-align:center}
.stat-card .num{font-size:1.5rem;font-weight:700;color:var(--accent)}
.stat-card .label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}

/* Controls */
.controls{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.controls-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
.controls-row:last-child{margin-bottom:0}
.search-box{flex:1;min-width:200px}
.search-box input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;color:var(--text);font-size:.9rem;outline:none}
.search-box input:focus{border-color:var(--accent)}
.search-box input::placeholder{color:var(--muted)}

select,button{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;color:var(--text);font-size:.8rem;cursor:pointer;outline:none}
select:focus,button:focus{border-color:var(--accent)}
select{appearance:auto;min-width:120px}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
button.primary:hover{opacity:.9}

.toggle-group{display:flex;gap:6px;flex-wrap:wrap}
.toggle-btn{padding:6px 10px;font-size:.75rem;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--muted);cursor:pointer;transition:all .15s}
.toggle-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.toggle-btn:hover{border-color:var(--accent)}

/* Grade chart */
.chart-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.chart-section h3{font-size:.85rem;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.04em}
.chart-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.chart-label{width:48px;font-size:.8rem;font-weight:600;text-align:right;flex-shrink:0}
.chart-bar-wrap{flex:1;height:22px;background:var(--bg);border-radius:4px;overflow:hidden;position:relative}
.chart-bar{height:100%;border-radius:4px;transition:width .4s ease}
.chart-count{font-size:.75rem;color:var(--muted);width:40px;text-align:right;flex-shrink:0}

/* Results counter */
.results-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 4px}
.results-count{font-size:.85rem;color:var(--muted)}

/* Job cards */
.cards-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){.cards-grid{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.cards-grid{grid-template-columns:1fr 1fr 1fr}}

.job-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.job-card:hover{border-color:var(--accent)}
.job-title{font-size:.95rem;font-weight:600;line-height:1.35}
.job-company{font-size:.85rem;color:var(--muted)}
.job-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.78rem;color:var(--muted)}
.job-meta span{display:inline-flex;align-items:center;gap:3px}
.grade-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.grade-S-1{background:rgba(188,140,255,.15);color:#bc8cff;border:1px solid rgba(188,140,255,.3)}
.grade-A-1{background:rgba(63,185,80,.15);color:#3fb950;border:1px solid rgba(63,185,80,.3)}
.grade-A-2{background:rgba(57,211,83,.15);color:#39d353;border:1px solid rgba(57,211,83,.3)}
.grade-B{background:rgba(210,153,34,.15);color:#d29922;border:1px solid rgba(210,153,34,.3)}
.grade-B-1{background:rgba(219,109,40,.15);color:#db6d28;border:1px solid rgba(219,109,40,.3)}
.grade-C{background:rgba(139,148,158,.15);color:#8b949e;border:1px solid rgba(139,148,158,.3)}
.grade-Senior{background:rgba(88,166,255,.15);color:#58a6ff;border:1px solid rgba(88,166,255,.3)}
.grade-default{background:rgba(139,148,158,.1);color:#8b949e;border:1px solid var(--border)}

.job-salary{font-size:.8rem;color:var(--green);font-weight:500}
.job-summary{font-size:.8rem;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.job-actions{margin-top:auto;padding-top:8px}
.job-link{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius);color:var(--accent);transition:all .15s}
.job-link:hover{background:var(--accent);color:#fff;text-decoration:none}

.no-results{text-align:center;padding:60px 20px;color:var(--muted);font-size:1rem}

/* Responsive tweaks */
@media(max-width:600px){
  .header h1{font-size:1.2rem}
  .stats-bar{gap:6px}
  .stat-card{min-width:80px;padding:10px 12px}
  .stat-card .num{font-size:1.2rem}
  .controls{padding:12px}
  .controls-row{gap:8px}
  select{min-width:100px}
  .chart-label{width:40px;font-size:.75rem}
}

/* Scrollbar */
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
</style>
</head>
<body>

<div class="header">
  <h1>🎯 Career OS — Job Dashboard</h1>
  <p>1,348 curated positions across Asia-Pacific</p>
</div>

<div class="container">
  <!-- Stats Bar -->
  <div class="stats-bar" id="statsBar"></div>

  <!-- Chart -->
  <div class="chart-section">
    <h3>Grade Distribution</h3>
    <div id="gradeChart"></div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="controls-row">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search title, company, location, summary…">
      </div>
      <button class="primary" onclick="exportCSV()">📥 Export CSV</button>
    </div>
    <div class="controls-row">
      <label style="font-size:.8rem;color:var(--muted)">Grade:</label>
      <div class="toggle-group" id="gradeFilters"></div>
    </div>
    <div class="controls-row">
      <label style="font-size:.8rem;color:var(--muted)">English:</label>
      <button class="toggle-btn" id="engBtn" onclick="toggleEnglish()">🌍 English-Friendly</button>
    </div>
    <div class="controls-row">
      <label style="font-size:.8rem;color:var(--muted)">Sort:</label>
      <select id="sortSelect" onchange="applyFilters()">
        <option value="qs-desc">Quality Score ↓</option>
        <option value="qs-asc">Quality Score ↑</option>
        <option value="date-desc">Date ↓</option>
        <option value="date-asc">Date ↑</option>
        <option value="company-asc">Company A→Z</option>
        <option value="grade-desc">Grade ↓</option>
      </select>
      <label style="font-size:.8rem;color:var(--muted);margin-left:8px">Source:</label>
      <select id="sourceSelect" onchange="applyFilters()">
        <option value="">All Sources</option>
      </select>
      <label style="font-size:.8rem;color:var(--muted);margin-left:8px">Location:</label>
      <select id="citySelect" onchange="applyFilters()">
        <option value="">All Locations</option>
      </select>
    </div>
  </div>

  <!-- Results counter -->
  <div class="results-info">
    <span class="results-count" id="resultsCount"></span>
  </div>

  <!-- Job cards -->
  <div class="cards-grid" id="cardsGrid"></div>
  <div class="no-results" id="noResults" style="display:none">No jobs match your filters.</div>
</div>

// Grade order & colors for chart
const GRADE_ORDER = ['S-1','A-1','A-2','B','B-1','C','Senior'];
const GRADE_COLORS = {'S-1':'#bc8cff','A-1':'#3fb950','A-2':'#39d353','B':'#d29922','B-1':'#db6d28','C':'#8b949e','Senior':'#58a6ff'};

// Derive sources & cities
const ALL_SOURCES = [...new Set(DATA.map(j=>j.s))].sort();
const ALL_CITIES = [...new Set(DATA.map(j=>j.cn).filter(Boolean))].sort();

// Populate dropdowns
const srcSel = document.getElementById('sourceSelect');
ALL_SOURCES.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;srcSel.appendChild(o)});
const citySel = document.getElementById('citySelect');
ALL_CITIES.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;citySel.appendChild(o)});

// Grade toggle buttons
const gradeCont = document.getElementById('gradeFilters');
let activeGrades = new Set(DATA.map(j=>j.g).filter(Boolean));
const allGrades = [...activeGrades].sort((a,b)=>{
  const ia = GRADE_ORDER.indexOf(a); const ib = GRADE_ORDER.indexOf(b);
  return (ia===-1?99:ia)-(ib===-1?99:ib);
});
allGrades.forEach(g=>{
  const btn = document.createElement('button');
  btn.className = 'toggle-btn active';
  btn.textContent = g;
  btn.dataset.grade = g;
  btn.onclick = ()=>{
    if(activeGrades.has(g)){activeGrades.delete(g);btn.classList.remove('active')}
    else{activeGrades.add(g);btn.classList.add('active')}
    applyFilters();
  };
  gradeCont.appendChild(btn);
});

// English toggle
let englishOnly = false;
function toggleEnglish(){
  englishOnly=!englishOnly;
  document.getElementById('engBtn').classList.toggle('active',englishOnly);
  applyFilters();
}

// Build grade chart
function buildGradeChart(filtered){
  const counts = {};
  GRADE_ORDER.forEach(g=>counts[g]=0);
  filtered.forEach(j=>{if(counts[j.g]!==undefined)counts[j.g]++});
  const max = Math.max(...Object.values(counts),1);
  let html='';
  GRADE_ORDER.forEach(g=>{
    const c=counts[g]; const pct=(c/max*100).toFixed(1);
    const col=GRADE_COLORS[g]||'#8b949e';
    html+=`<div class="chart-row">
      <span class="chart-label" style="color:${col}">${g}</span>
      <div class="chart-bar-wrap"><div class="chart-bar" style="width:${pct}%;background:${col}"></div></div>
      <span class="chart-count">${c}</span>
    </div>`;
  });
  document.getElementById('gradeChart').innerHTML=html;
}

// Build stats
function buildStats(filtered){
  const total = DATA.length;
  const showing = filtered.length;
  const srcCount = new Set(DATA.map(j=>j.s)).size;
  const urlCount = DATA.filter(j=>j.u).length;
  const gradeCounts = {};
  GRADE_ORDER.forEach(g=>gradeCounts[g]=0);
  DATA.forEach(j=>{if(gradeCounts[j.g]!==undefined)gradeCounts[j.g]++});

  let html=`
    <div class="stat-card"><div class="num">${total.toLocaleString()}</div><div class="label">Total Jobs</div></div>
    <div class="stat-card"><div class="num">${srcCount}</div><div class="label">Sources</div></div>
    <div class="stat-card"><div class="num">${urlCount.toLocaleString()}</div><div class="label">Direct URLs</div></div>`;
  GRADE_ORDER.forEach(g=>{
    html+=`<div class="stat-card"><div class="num" style="color:${GRADE_COLORS[g]||'#8b949e'}">${gradeCounts[g]}</div><div class="label">${g}</div></div>`;
  });
  document.getElementById('statsBar').innerHTML=html;
}

// Grade sort rank
function gradeRank(g){const i=GRADE_ORDER.indexOf(g);return i===-1?99:i}

// Main filter/sort
let lastFiltered = [];
function applyFilters(){
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const src = srcSel.value;
  const city = citySel.value;
  const sort = document.getElementById('sortSelect').value;

  let filtered = DATA.filter(j=>{
    if(src && j.s!==src) return false;
    if(city && j.cn!==city) return false;
    if(!activeGrades.has(j.g)) return false;
    if(englishOnly && !j.e) return false;
    if(q){
      const hay = (j.t+' '+j.c+' '+j.l+' '+j.su+' '+j.rt+' '+j.sa).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  // Sort
  if(sort==='qs-desc') filtered.sort((a,b)=>(b.qs||0)-(a.qs||0));
  else if(sort==='qs-asc') filtered.sort((a,b)=>(a.qs||0)-(b.qs||0));
  else if(sort==='date-desc') filtered.sort((a,b)=>(b.d||'').localeCompare(a.d||''));
  else if(sort==='date-asc') filtered.sort((a,b)=>(a.d||'').localeCompare(b.d||''));
  else if(sort==='company-asc') filtered.sort((a,b)=>(a.c||'').localeCompare(b.c||''));
  else if(sort==='grade-desc') filtered.sort((a,b)=>gradeRank(a.g)-gradeRank(b.g));

  lastFiltered = filtered;
  document.getElementById('resultsCount').textContent = `Showing ${filtered.length.toLocaleString()} of ${DATA.length.toLocaleString()} jobs`;
  buildGradeChart(filtered);
  renderCards(filtered);
}

// Render cards (virtualized — show first 200, lazy load rest)
const PAGE_SIZE = 200;
let renderedCount = 0;
function renderCards(list){
  const grid = document.getElementById('cardsGrid');
  const noRes = document.getElementById('noResults');
  grid.innerHTML='';
  renderedCount = 0;
  if(list.length===0){noRes.style.display='';return}
  noRes.style.display='none';
  loadMoreCards(list);
}
function loadMoreCards(list){
  const grid = document.getElementById('cardsGrid');
  const end = Math.min(renderedCount+PAGE_SIZE, list.length);
  for(let i=renderedCount;i<end;i++){
    const j=list[i];
    const gradeClass = 'grade-'+(j.g||'default');
    grid.innerHTML += `
      <div class="job-card">
        <div class="job-title">${esc(j.t||j.c||'Untitled')}</div>
        ${j.c?`<div class="job-company">${esc(j.c)}</div>`:''}
        <div class="job-meta">
          <span class="grade-badge ${gradeClass}">${esc(j.g||'N/A')}</span>
          <span>📍 ${esc(j.l||'')}</span>
          ${j.rt?`<span>💼 ${esc(j.rt)}</span>`:''}
          ${j.d?`<span>📅 ${esc(j.d)}</span>`:''}
        </div>
        ${j.sa?`<div class="job-salary">💰 ${esc(j.sa)}</div>`:''}
        ${j.su?`<div class="job-summary">${esc(j.su)}</div>`:''}
        <div class="job-actions">
          ${j.u?`<a href="${esc(j.u)}" target="_blank" rel="noopener" class="job-link">🔗 Apply / View</a>`:''}
        </div>
      </div>`;
  }
  renderedCount = end;
}
function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}

// Infinite scroll
window.addEventListener('scroll',()=>{
  if(renderedCount<lastFiltered.length && window.innerHeight+window.scrollY>=document.body.offsetHeight-400){
    loadMoreCards(lastFiltered);
  }
});

// CSV export
function exportCSV(){
  const rows = [['Title','Company','Location','Grade','Source','Salary','URL','English Friendly','Scanned Date','Role Type','Quality Score']];
  lastFiltered.forEach(j=>{
    rows.push([j.t,j.c,j.l,j.g,j.s,j.sa,j.u,j.e?'Yes':'No',j.d,j.rt,j.qs]);
  });
  const csv = rows.map(r=>r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'career-os-jobs.csv';
  a.click();
}

// Search debounce
let searchTimer;
document.getElementById('searchInput').addEventListener('input',()=>{
  clearTimeout(searchTimer);
  searchTimer = setTimeout(applyFilters,200);
});

// Init
buildStats(DATA);
applyFilters();
</script>
