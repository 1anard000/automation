<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career OS Dashboard</title>
<style>
  :root { --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a; --text: #e4e4e7; --muted: #71717a; --accent: #6366f1; --green: #22c55e; --yellow: #eab308; --red: #ef4444; --blue: #3b82f6; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; }
  .header { margin-bottom: 32px; }
  .header h1 { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
  .header .sub { color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .stat-card .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .stat-card .value { font-size: 32px; font-weight: 700; }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.blue { color: var(--blue); }
  .stat-card .value.yellow { color: var(--yellow); }
  .stat-card .value.accent { color: var(--accent); }
  .section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
  .section h2 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  .bar-chart { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: flex; align-items: center; gap: 12px; }
  .bar-label { width: 140px; font-size: 13px; color: var(--muted); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; height: 24px; background: var(--border); border-radius: 6px; overflow: hidden; position: relative; }
  .bar-fill { height: 100%; border-radius: 6px; transition: width 0.6s ease; }
  .bar-count { width: 40px; font-size: 13px; font-weight: 600; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 768px) { .two-col { grid-template-columns: 1fr; } }
  .grade-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 700; margin-right: 6px; }
  .grade-S { background: #7c3aed22; color: #a78bfa; border: 1px solid #7c3aed44; }
  .grade-A { background: #22c55e22; color: #4ade80; border: 1px solid #22c55e44; }
  .grade-B { background: #3b82f622; color: #60a5fa; border: 1px solid #3b82f644; }
  .grade-C { background: #eab30822; color: #facc15; border: 1px solid #eab30844; }
  .grade-D { background: #ef444422; color: #f87171; border: 1px solid #ef444444; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--border); }
  tr:hover td { background: #ffffff06; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .updated { color: var(--muted); font-size: 12px; margin-top: 16px; text-align: center; }
</style>
</head>
<body>

<div class="header">
  <h1>🚀 Career OS Dashboard</h1>
  <div class="sub">Job search intelligence • Updated <span id="ts"></span></div>
</div>

<div class="grid" id="stats"></div>

<div class="two-col">
  <div class="section">
    <h2>📍 By Location</h2>
    <div class="bar-chart" id="locations"></div>
  </div>
  <div class="section">
    <h2>🌐 By Source</h2>
    <div class="bar-chart" id="sources"></div>
  </div>
</div>

<div class="section">
  <h2>📊 Grade Distribution</h2>
  <div class="bar-chart" id="grades"></div>
</div>

<div class="section">
  <h2>⭐ Top Graded Jobs</h2>
  <table>
    <thead><tr><th>Grade</th><th>Title</th><th>Company</th><th>Location</th><th>Source</th></tr></thead>
    <tbody id="top-jobs"></tbody>
  </table>
</div>

<div class="updated">Data from jobs-all.json • Career OS v1.0</div>

<script>
fetch('jobs-all.json').then(r=>r.json()).then(jobs=>{
  document.getElementById('ts').textContent = new Date().toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});

  // Stats
  const graded = jobs.filter(j=>j.grade);
  const scores = jobs.map(j=>j.score||0).filter(s=>s>0);
  const avgScore = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : '—';
  const locs = {};
  jobs.forEach(j=>{ const l=(j.location||j.city||'Unknown').split(',')[0].trim(); locs[l]=(locs[l]||0)+1; });
  const topLoc = Object.entries(locs).sort((a,b)=>b[1]-a[1])[0];

  const statsHtml = [
    {label:'Total Jobs', value:jobs.length, cls:'accent'},
    {label:'Graded', value:graded.length+'/'+jobs.length, cls:'green'},
    {label:'Locations', value:Object.keys(locs).length, cls:'blue'},
    {label:'Top Location', value:topLoc?topLoc[0]:'—', cls:'yellow'},
  ].map(s=>`<div class="stat-card"><div class="label">${s.label}</div><div class="value ${s.cls}">${s.value}</div></div>`).join('');
  document.getElementById('stats').innerHTML = statsHtml;

  // Bars helper
  function renderBars(containerId, data, color) {
    const max = Math.max(...data.map(d=>d[1]),1);
    document.getElementById(containerId).innerHTML = data.map(([label,count])=>{
      const pct = (count/max*100).toFixed(0);
      return `<div class="bar-row"><div class="bar-label">${label}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div><div class="bar-count">${count}</div></div>`;
    }).join('');
  }

  // Locations
  const locArr = Object.entries(locs).sort((a,b)=>b[1]-a[1]).slice(0,10);
  renderBars('locations', locArr, '#6366f1');

  // Sources
  const srcs = {};
  jobs.forEach(j=>{ const s=j.source||'unknown'; srcs[s]=(srcs[s]||0)+1; });
  const srcArr = Object.entries(srcs).sort((a,b)=>b[1]-a[1]).slice(0,10);
  renderBars('sources', srcArr, '#3b82f6');

  // Grades
  const grades = {};
  ['S','A','B','C','D'].forEach(g=>grades[g]=0);
  jobs.forEach(j=>{ if(j.grade&&grades.hasOwnProperty(j.grade)) grades[j.grade]++; });
  const gradeColors = {S:'#a78bfa',A:'#4ade80',B:'#60a5fa',C:'#facc15',D:'#f87171'};
  const gradeArr = Object.entries(grades).filter(([_,v])=>v>0);
  renderBars('grades', gradeArr, null);
  // Override colors for grades
  document.querySelectorAll('#grades .bar-fill').forEach((el,i)=>{
    el.style.background = gradeColors[gradeArr[i][0]];
  });

  // Top jobs table
  const top = jobs.filter(j=>j.grade).sort((a,b)=>{
    const order = {S:0,A:1,B:2,C:3,D:4};
    return (order[a.grade]||5)-(order[b.grade]||5);
  }).slice(0,15);
  document.getElementById('top-jobs').innerHTML = top.map(j=>{
    const g = j.grade || '?';
    const t = j.title || 'Untitled';
    const c = j.company || '—';
    const l = (j.location||j.city||'—').split(',')[0];
    const s = j.source || '—';
    const link = j.url ? `<a href="${j.url}" target="_blank">${t}</a>` : t;
    return `<tr><td><span class="grade-badge grade-${g}">${g}</span></td><td>${link}</td><td>${c}</td><td>${l}</td><td>${s}</td></tr>`;
  }).join('');
}).catch(e=>{
  document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#ef4444">Failed to load jobs data. Make sure jobs-all.json is accessible.</div>';
});
</script>
</body>
</html>
