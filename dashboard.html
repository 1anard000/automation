    var stBadge='<span class="status-badge st-'+st+'" data-job-id="'+j.job_id+'" title="Click to change status">'+STATUS_LABELS[st]+'</span>';
    var note=getNote(j.job_id),ni=note?'📝':'💬',nc=note?'has-notes':'';
    var nh='<div class="notes-area"><button class="notes-toggle '+nc+'" data-toggle-notes="'+j.job_id+'">'+ni+' Notes</button><span class="notes-saved" id="saved-'+j.job_id+'">✓ saved</span><div class="notes-content" id="notes-'+j.job_id+'"><textarea class="notes-input" placeholder="Add a note..." data-save-note="'+j.job_id+'">'+note+'</textarea></div></div>';
    return '<div class="jc"><div class="t">'+ti+'<span class="ut ut-'+(j.url_type||'unknown')+'">'+{direct:'🎯 Direct',search:'🔍 Search',login_required:'🔒 Login'}[j.url_type||'unknown']+'</span>'+(nf?'<span class="url-fix">🔧 URL Fix Needed</span>':'')+(ie?'<span class="en">🌐 EN</span>':'')+'</div><div class="co">'+co+' <span class="tier tier-'+(j._company_tier||'startup')+'">'+((j._company_tier||'startup').charAt(0).toUpperCase()+(j._company_tier||'startup').slice(1))+'</span> '+fitBadge+' '+stBadge+'</div>'+(sm?'<div class="sm">'+sm.substring(0,150)+(sm.length>150?'...':'')+'</div>':'')+'<div class="mt"><span class="lc">'+l+'</span><span class="sc">'+sc+'</span><span class="bg bg-'+t.toLowerCase()+'">'+t+' '+s+'</span>'+sal+(j.app_difficulty?'<span>⚡ '+j.app_difficulty+'</span>':'')+'</div><div class="lk"><a href="'+au+'" target="_blank" class="'+ac+'">'+at+'</a>'+(dk?'<a href="'+g+'" target="_blank" class="gs">🔍 Bing</a>':'')+'</div>'+nh+'</div>';
  }).join('');
  var ce=document.getElementById('result-count');
  if(ce){var hasSb=sb&&sb.value.trim();ce.textContent=d.length+' of '+jobs.length+' jobs'+(hasSb?' matching "'+sb.value.trim()+'"':'')}
}
document.querySelectorAll('#status-flt .st-btn').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('#status-flt .st-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');const f=b.dataset.f;if(f==='st_all_status'){statusFilter=null;render(currentFilter)}else{statusFilter=f.replace('st_','');render(currentFilter)}})});
document.querySelectorAll('.flt button:not(.st-btn)').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('.flt button:not(.st-btn)').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(b.dataset.f)})});
document.getElementById('sort').addEventListener('change',()=>{render(currentFilter)});
document.addEventListener('click',e=>{
  const badge=e.target.closest('.status-badge[data-job-id]');
  if(badge){cycleStatus(badge.dataset.jobId);return}
  const toggle=e.target.closest('[data-toggle-notes]');
  if(toggle){toggleNotes(toggle.dataset.toggleNotes);return}
});
document.addEventListener('input',e=>{
  if(e.target.dataset.saveNote)saveNote(e.target.dataset.saveNote,e.target.value);
});
updateStats();
render('all');

</script>
<script>
(function(){var b=document.getElementById('btt');window.addEventListener('scroll',function(){b.style.display=window.scrollY>400?'flex':'none'});b.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})})})();
document.addEventListener('keydown',function(e){
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
    e.preventDefault();document.getElementById('search-box').focus();
  }
  if(e.key==='Escape'){
    var s=document.getElementById('search-box');
    if(document.activeElement===s){s.value='';s.blur();render(currentFilter)}
  }
});
/* Staleness badges — compute days since scan and add color-coded badges */
(function(){
  var jobMap={};jobs.forEach(function(j){jobMap[j.job_id]=j});
  var today=new Date();
  function daysSince(d){if(!d)return-1;var dt=new Date(d);return Math.floor((today-dt)/(864e5))}
  function addStaleness(){
    document.querySelectorAll('.jc').forEach(function(card){
      if(card.querySelector('.staleness'))return;
      /* find job_id from status-badge data attribute */
      var badge=card.querySelector('.status-badge[data-job-id]');
      if(!badge)return;
      var jid=badge.dataset.jobId;
      var j=jobMap[jid];
      if(!j||!j.scanned_date)return;
      var d=daysSince(j.scanned_date);
      if(d<0)return;
      var cls,label;
      if(d<=2){cls='staleness-fresh';label='✅ '+d+'d ago'}
      else if(d<=4){cls='staleness-ok';label='📅 '+d+'d ago'}
      else if(d<=6){cls='staleness-stale';label='⏰ '+d+'d old'}
      else{cls='staleness-ancient';label='🔥 '+d+'d old!'}
      var span=document.createElement('span');
      span.className='staleness '+cls;
      span.textContent=label;
      span.title='Scanned: '+j.scanned_date;
      var titleEl=card.querySelector('.t');
      if(titleEl)titleEl.appendChild(span);
    });
  }
  var obs=new MutationObserver(addStaleness);
  obs.observe(document.getElementById('jobs'),{childList:true});
  addStaleness();
})();
/* Theme toggle — dark/light with localStorage persistence */
(function(){
  var btn=document.getElementById('theme-toggle');
  var saved=localStorage.getItem('career_os_theme');
  var prefersLight=window.matchMedia&&window.matchMedia('(prefers-color-scheme:light)').matches;
  var isLight=saved==='light'||(!saved&&prefersLight);
  function applyTheme(light){
    if(light){document.body.classList.add('light');btn.textContent='☀️';}
    else{document.body.classList.remove('light');btn.textContent='🌙';}
  }
  applyTheme(isLight);
  btn.addEventListener('click',function(){
    isLight=!isLight;
    applyTheme(isLight);
    localStorage.setItem('career_os_theme',isLight?'light':'dark');
  });
})();
</script>
