    const hasGoogle = googleUrl && googleUrl !== applyUrl;
    let linksHtml = '<a href="' + applyUrl + '" target="_blank">Apply →</a>';
    if (hasGoogle) linksHtml += '<a href="' + googleUrl + '" target="_blank" class="google">🔍 Google Search</a>';
    return '<div class="job-card">' +
      '<div class="title">' + title + '</div>' +
      '<div class="company">' + company + '</div>' +
      (summary ? '<div class="summary">' + summary.substring(0,150) + (summary.length>150?'...':'') + '</div>' : '') +
      '<div class="meta">' +
        '<span class="loc">' + loc + '</span>' +
        '<span class="src">' + src + '</span>' +
        '<span class="badge badge-' + tier.toLowerCase() + '">' + tier + ' ' + score + '</span>' +
        (j.salary ? '<span>💰 ' + j.salary + '</span>' : '') +
      '</div>' +
      '<div class="links">' + linksHtml + '</div>' +
    '</div>';
  }).join('');
}
document.querySelectorAll('.filters button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.filter);
  });
});
render('all');
</script>
</body>
</html>
